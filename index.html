<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейный журнал</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 20px;
    color: #1e2233;
  }
  h1 { text-align: center; margin: 0 0 18px; font-size: 24px; }

  /* --- Вкладки --- */
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .tab {
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: #e9ecf5;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: #3b4a86;
    transition: .15s;
  }
  .tab:hover { background: #dbe0ee; }
  .tab.active {
    background: #5b7cfa;
    color: #fff;
    border-color: #4763d8;
  }

  /* --- Разделы --- */
  .section { display: none; }
  .section.active { display: block; }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
    max-width: 900px;
    margin: 0 auto 20px;
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #d0d5e0;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    outline: none;
  }
  input:focus, select:focus { border-color: #5b7cfa; }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .btn-primary { background: #5b7cfa; color: #fff; }
  .btn-primary:hover { background: #4763d8; }
  .btn-clear { background: #e9ecf5; color: #333; }
  .btn-clear:hover { background: #dbe0ee; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }

  table {
    width: 100%;
    border-collapse: collapse;
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  th, td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid #eef0f6;
    font-size: 15px;
  }
  th {
    background: #eef2ff;
    font-weight: 600;
    color: #3b4a86;
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbff; }

  .grade {
    display: inline-block;
    min-width: 28px;
    text-align: center;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
  }
  .g5 { background: #d7f5dc; color: #1e7c3a; }
  .g4 { background: #e0ecff; color: #2b5fd1; }
  .g3 { background: #fff3d6; color: #a06a00; }
  .g2 { background: #ffd9d9; color: #b32121; }

  .empty {
    text-align: center;
    color: #888;
    padding: 30px 10px;
    font-size: 15px;
    background: #fff;
    max-width: 900px;
    margin: 0 auto;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  .delete-btn {
    background: none;
    border: none;
    color: #ff5c5c;
    cursor: pointer;
    font-size: 18px;
    padding: 0 6px;
  }
  .delete-btn:hover { color: #b32121; }

  .day-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    background: #eef2ff;
    color: #3b4a86;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>
<body>

<h1>📘 Семейный журнал</h1>

<!-- Вкладки -->
<div class="tabs">
  <button class="tab active" data-tab="mama"   onclick="switchTab('mama')">👩 Мама</button>
  <button class="tab"        data-tab="papa"   onclick="switchTab('papa')">👨 Папа</button>
  <button class="tab"        data-tab="ya"     onclick="switchTab('ya')">🧑 Я</button>
  <button class="tab"        data-tab="sestra" onclick="switchTab('sestra')">👧 Сестра</button>
</div>

<!-- ================= МАМА ================= -->
<div class="section active" id="sec-mama">
  <div class="card">
    <div class="form-row">
      <div>
        <label>День недели</label>
        <select id="day-mama">
          <option>Понедельник</option><option>Вторник</option>
          <option>Среда</option><option>Четверг</option>
          <option>Пятница</option><option>Суббота</option>
        </select>
      </div>
      <div>
        <label>Предмет</label>
        <input id="subject-mama" type="text" placeholder="Например: Инфосфера">
      </div>
      <div>
        <label>Задание</label>
        <input id="task-mama" type="text" placeholder="Что задано">
      </div>
      <div>
        <label>Оценка</label>
        <select id="grade-mama">
          <option value="">—</option>
          <option value="5">5</option><option value="4">4</option>
          <option value="3">3</option><option value="2">2</option>
        </select>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="addEntry('mama')">✏️ Заполнить</button>
      <button class="btn btn-clear"  onclick="clearAll('mama')">🗑 Очистить</button>
    </div>
  </div>
  <div id="journal-mama"></div>
</div>

<!-- ================= ПАПА ================= -->
<div class="section" id="sec-papa">
  <div class="card">
    <div class="form-row">
      <div>
        <label>День недели</label>
        <select id="day-papa">
          <option>Понедельник</option><option>Вторник</option>
          <option>Среда</option><option>Четверг</option>
          <option>Пятница</option><option>Суббота</option>
        </select>
      </div>
      <div>
        <label>Предмет</label>
        <input id="subject-papa" type="text" placeholder="Например: Инфосфера">
      </div>
      <div>
        <label>Задание</label>
        <input id="task-papa" type="text" placeholder="Что задано">
      </div>
      <div>
        <label>Оценка</label>
        <select id="grade-papa">
          <option value="">—</option>
          <option value="5">5</option><option value="4">4</option>
          <option value="3">3</option><option value="2">2</option>
        </select>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="addEntry('papa')">✏️ Заполнить</button>
      <button class="btn btn-clear"  onclick="clearAll('papa')">🗑 Очистить</button>
    </div>
  </div>
  <div id="journal-papa"></div>
</div>

<!-- ================= Я ================= -->
<div class="section" id="sec-ya">
  <div class="card">
    <div class="form-row">
      <div>
        <label>День недели</label>
        <select id="day-ya">
          <option>Понедельник</option><option>Вторник</option>
          <option>Среда</option><option>Четверг</option>
          <option>Пятница</option><option>Суббота</option>
        </select>
      </div>
      <div>
        <label>Предмет</label>
        <input id="subject-ya" type="text" placeholder="Например: Инфосфера">
      </div>
      <div>
        <label>Задание</label>
        <input id="task-ya" type="text" placeholder="Что задано">
      </div>
      <div>
        <label>Оценка</label>
        <select id="grade-ya">
          <option value="">—</option>
          <option value="5">5</option><option value="4">4</option>
          <option value="3">3</option><option value="2">2</option>
        </select>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="addEntry('ya')">✏️ Заполнить</button>
      <button class="btn btn-clear"  onclick="clearAll('ya')">🗑 Очистить</button>
    </div>
  </div>
  <div id="journal-ya"></div>
</div>

<!-- ================= СЕСТРА ================= -->
<div class="section" id="sec-sestra">
  <div class="card">
    <div class="form-row">
      <div>
        <label>День недели</label>
        <select id="day-sestra">
          <option>Понедельник</option><option>Вторник</option>
          <option>Среда</option><option>Четверг</option>
          <option>Пятница</option><option>Суббота</option>
        </select>
      </div>
      <div>
        <label>Предмет</label>
        <input id="subject-sestra" type="text" placeholder="Например: Инфосфера">
      </div>
      <div>
        <label>Задание</label>
        <input id="task-sestra" type="text" placeholder="Что задано">
      </div>
      <div>
        <label>Оценка</label>
        <select id="grade-sestra">
          <option value="">—</option>
          <option value="5">5</option><option value="4">4</option>
          <option value="3">3</option><option value="2">2</option>
        </select>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="addEntry('sestra')">✏️ Заполнить</button>
      <button class="btn btn-clear"  onclick="clearAll('sestra')">🗑 Очистить</button>
    </div>
  </div>
  <div id="journal-sestra"></div>
</div>

<script>
  const PEOPLE = ['mama', 'papa', 'ya', 'sestra'];
  const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

  // Хранилище: { mama: [...], papa: [...], ya: [...], sestra: [...] }
  const STORAGE_KEY = 'familyJournal';
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  PEOPLE.forEach(p => { if (!data[p]) data[p] = []; });

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // --- Вкладки ---
  function switchTab(person) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('sec-' + person).classList.add('active');
    document.querySelector(`.tab[data-tab="${person}"]`).classList.add('active');
  }

  // --- Добавить запись ---
  function addEntry(person) {
    const day     = document.getElementById('day-' + person).value;
    const subject = document.getElementById('subject-' + person).value.trim();
    const task    = document.getElementById('task-' + person).value.trim();
    const grade   = document.getElementById('grade-' + person).value;

    if (!subject) {
      alert('Впиши предмет (например, Инфосфера)');
      return;
    }

    data[person].push({ id: Date.now(), day, subject, task, grade });
    save();
    render(person);

    document.getElementById('subject-' + person).value = '';
    document.getElementById('task-' + person).value = '';
    document.getElementById('grade-' + person).value = '';
  }

  function removeEntry(person, id) {
    data[person] = data[person].filter(e => e.id !== id);
    save();
    render(person);
  }

  function clearAll(person) {
    if (data[person].length === 0) return;
    if (!confirm('Удалить все записи этого раздела?')) return;
    data[person] = [];
    save();
    render(person);
  }

  // --- Отрисовка ---
  function gradeClass(g) { return 'g' + g; }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function render(person) {
    const box = document.getElementById('journal-' + person);
    const list = data[person];

    if (list.length === 0) {
      box.innerHTML = '<div class="empty">Пока пусто. Заполни первую запись — например, «Понедельник → Инфосфера».</div>';
      return;
    }

    const grouped = {};
    DAYS.forEach(d => grouped[d] = []);
    list.forEach(e => {
      if (!grouped[e.day]) grouped[e.day] = [];
      grouped[e.day].push(e);
    });

    let html = '<table><thead><tr><th>День</th><th>Предмет</th><th>Задание</th><th>Оценка</th><th></th></tr></thead><tbody>';
    DAYS.forEach(day => {
      grouped[day].forEach(e => {
        html += `<tr>
          <td><span class="day-badge">${e.day}</span></td>
          <td>${escapeHtml(e.subject)}</td>
          <td>${escapeHtml(e.task) || '<span style="color:#aaa">—</span>'}</td>
          <td>${e.grade ? `<span class="grade ${gradeClass(e.grade)}">${e.grade}</span>` : '<span style="color:#aaa">—</span>'}</td>
          <td><button class="delete-btn" onclick="removeEntry('${person}', ${e.id})" title="Удалить">✕</button></td>
        </tr>`;
      });
    });
    html += '</tbody></table>';
    box.innerHTML = html;
  }

  // --- Enter = быстрая отправка (для каждого раздела) ---
  PEOPLE.forEach(p => {
    document.getElementById('subject-' + p).addEventListener('keydown', e => {
      if (e.key === 'Enter') addEntry(p);
    });
    document.getElementById('task-' + p).addEventListener('keydown', e => {
      if (e.key === 'Enter') addEntry(p);
    });
  });

  // --- Первая отрисовка ---
  PEOPLE.forEach(render);
</script>
</body>
                                    </html>
